<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WasteTime Chat</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,sans-serif;height:100vh;display:grid;place-items:center}
.app{width:min(900px,96vw);height:min(760px,94vh);background:#161b22;border:1px solid #30363d;border-radius:18px;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;box-shadow:0 20px 70px #0008}
header{padding:16px 18px;border-bottom:1px solid #30363d;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:19px;margin:0}.sub{font-size:12px;color:#8b949e}
.account{display:flex;align-items:center;gap:8px}.me{font:13px ui-monospace,monospace;background:#0d1117;padding:8px 10px;border-radius:10px}
.smallbtn{padding:8px 10px;background:#21262d}
#messages{overflow:auto;padding:18px;display:flex;flex-direction:column;gap:11px}
.msg{display:grid;grid-template-columns:12px 1fr;gap:9px;align-items:start}.dot{width:10px;height:10px;border-radius:50%;margin-top:7px}
.bubble{background:#21262d;border:1px solid #30363d;border-radius:12px;padding:9px 11px;min-width:0}.meta{display:flex;gap:8px;align-items:baseline;margin-bottom:3px}.name{font-weight:800}.time{font-size:11px;color:#8b949e}.text{white-space:pre-wrap;overflow-wrap:anywhere}
form#chatForm{display:grid;grid-template-columns:1fr auto;gap:9px;padding:13px;border-top:1px solid #30363d}
input,button{font:inherit;border-radius:10px;border:1px solid #30363d}
input{background:#0d1117;color:#e6edf3;padding:12px}
button{background:#238636;color:white;font-weight:800;padding:0 18px;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.overlay{position:fixed;inset:0;background:#0d1117ee;display:grid;place-items:center;padding:20px}
.authbox{width:min(460px,95vw);background:#161b22;border:1px solid #30363d;border-radius:18px;padding:24px}
.authbox h2{margin:0 0 6px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.tabs button{height:40px;background:#21262d}.tabs button.active{background:#238636}
.authbox input{width:100%;margin:6px 0}
.hint,.error{font-size:12px}.hint{color:#8b949e}.error{color:#ff7b72;min-height:19px;margin-top:6px}
.authbox .go{height:43px;width:100%;margin-top:8px}
.hidden{display:none!important}.status{font-size:12px;color:#8b949e}
</style>
</head>
<body>

<div class="app">
<header>
  <div><h1>WasteTime Chat 🗿</h1><div class="sub">Persistent accounts + public live chat.</div></div>
  <div>
    <div id="status" class="status">connecting…</div>
    <div class="account">
      <div id="me" class="me">not logged in</div>
      <button id="logout" class="smallbtn hidden">Log out</button>
    </div>
  </div>
</header>

<main id="messages"></main>

<form id="chatForm">
  <input id="message" maxlength="500" autocomplete="off" placeholder="Log in to chat…" disabled>
  <button id="send" disabled>Send</button>
</form>
</div>

<div id="overlay" class="overlay">
  <div class="authbox">
    <h2>WasteTime Account</h2>
    <div class="hint">Create an account once, then log back in from another computer.</div>

    <div class="tabs">
      <button id="loginTab" class="active">Log in</button>
      <button id="registerTab">Register</button>
    </div>

    <div id="registerFields" class="hidden">
      <input id="username" maxlength="10" autocomplete="username" placeholder="Username (1–10 ASCII chars)">
    </div>

    <input id="email" type="email" autocomplete="email" placeholder="Email">
    <input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="Password (6+ chars)">

    <div id="authError" class="error"></div>
    <button id="authGo" class="go">Log in</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
  getDatabase, ref, push, query, limitToLast, onChildAdded,
  get, set
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { firebaseConfig, databaseURL } from "./config.js";

const $ = id => document.getElementById(id);
const app = initializeApp({...firebaseConfig, databaseURL});
const db = getDatabase(app, databaseURL);
const auth = getAuth(app);

let mode = "login";
let profile = null;
let messagesStarted = false;

const randomColor = () => `hsl(${Math.floor(Math.random()*360)} 82% 68%)`;

function validName(s){
  if(s.length < 1 || s.length > 10) return false;
  return [...s].every(ch => {
    const n = ch.charCodeAt(0);
    return n >= 33 && n <= 126;
  });
}

function setMode(next){
  mode = next;
  const reg = next === "register";
  $("loginTab").classList.toggle("active", !reg);
  $("registerTab").classList.toggle("active", reg);
  $("registerFields").classList.toggle("hidden", !reg);
  $("authGo").textContent = reg ? "Create account" : "Log in";
  $("authError").textContent = "";
  $("password").autocomplete = reg ? "new-password" : "current-password";
}

$("loginTab").onclick = () => setMode("login");
$("registerTab").onclick = () => setMode("register");

function showMessage(m){
  if(!m || typeof m.name !== "string" || typeof m.text !== "string") return;

  const row = document.createElement("div");
  row.className = "msg";

  const dot = document.createElement("div");
  dot.className = "dot";
  dot.style.background = m.color || "#aaa";

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  const meta = document.createElement("div");
  meta.className = "meta";

  const name = document.createElement("span");
  name.className = "name";
  name.textContent = m.name;
  name.style.color = m.color || "#ddd";

  const time = document.createElement("span");
  time.className = "time";
  time.textContent = m.createdAt
    ? new Date(m.createdAt).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"})
    : "now";

  const text = document.createElement("div");
  text.className = "text";
  text.textContent = m.text;

  meta.append(name, time);
  bubble.append(meta, text);
  row.append(dot, bubble);
  $("messages").append(row);
  $("messages").scrollTop = $("messages").scrollHeight;
}

function startMessages(){
  if(messagesStarted) return;
  messagesStarted = true;
  const recent = query(ref(db, "messages"), limitToLast(100));
  onChildAdded(recent, snap => showMessage(snap.val()));
}

async function loadProfile(uid){
  const snap = await get(ref(db, `profiles/${uid}`));
  return snap.exists() ? snap.val() : null;
}

$("authGo").onclick = async () => {
  const email = $("email").value.trim();
  const password = $("password").value;
  $("authError").textContent = "";

  try{
    if(mode === "register"){
      const username = $("username").value;
      if(!validName(username)){
        $("authError").textContent = "Username must be 1–10 printable ASCII characters, with no spaces.";
        return;
      }

      const cred = await createUserWithEmailAndPassword(auth, email, password);
      const newProfile = {
        name: username,
        color: randomColor(),
        createdAt: Date.now()
      };
      await set(ref(db, `profiles/${cred.user.uid}`), newProfile);
    }else{
      await signInWithEmailAndPassword(auth, email, password);
    }
  }catch(err){
    console.error(err);
    const code = (err.code || "").replace("auth/", "").replaceAll("-", " ");
    $("authError").textContent = code || "Login failed.";
  }
};

$("password").addEventListener("keydown", e => {
  if(e.key === "Enter") $("authGo").click();
});

onAuthStateChanged(auth, async user => {
  if(!user){
    profile = null;
    $("overlay").classList.remove("hidden");
    $("logout").classList.add("hidden");
    $("me").textContent = "not logged in";
    $("message").disabled = true;
    $("send").disabled = true;
    $("message").placeholder = "Log in to chat…";
    $("status").textContent = "not logged in";
    return;
  }

  $("status").textContent = "loading account…";

  try{
    profile = await loadProfile(user.uid);

    if(!profile){
      $("authError").textContent = "This account has no chat profile. Register again or check Firebase rules.";
      await signOut(auth);
      return;
    }

    $("me").textContent = profile.name;
    $("me").style.color = profile.color;
    $("overlay").classList.add("hidden");
    $("logout").classList.remove("hidden");
    $("message").disabled = false;
    $("send").disabled = false;
    $("message").placeholder = "Say something…";
    $("status").textContent = "online";
    startMessages();
    $("message").focus();
  }catch(err){
    console.error(err);
    $("status").textContent = "profile error";
  }
});

$("logout").onclick = () => signOut(auth);

$("chatForm").onsubmit = async e => {
  e.preventDefault();
  const user = auth.currentUser;
  const text = $("message").value.trim();

  if(!user || !profile || !text) return;
  $("message").value = "";

  try{
    await push(ref(db, "messages"), {
      uid: user.uid,
      name: profile.name,
      color: profile.color,
      text: text.slice(0, 500),
      createdAt: Date.now()
    });
    $("status").textContent = "online";
  }catch(err){
    console.error(err);
    $("status").textContent = "send failed";
  }
};
</script>
</body>
</html>
