<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WasteTime Chat</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,sans-serif;height:100vh;display:grid;place-items:center}
.app{width:min(900px,96vw);height:min(760px,94vh);background:#161b22;border:1px solid #30363d;border-radius:18px;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
header{padding:16px 18px;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;gap:12px}
#messages{overflow:auto;padding:18px;display:flex;flex-direction:column;gap:11px}
.msg{display:grid;grid-template-columns:12px 1fr;gap:9px}.dot{width:10px;height:10px;border-radius:50%;margin-top:7px}
.bubble{background:#21262d;border:1px solid #30363d;border-radius:12px;padding:9px 11px}.name{font-weight:800}.time{font-size:11px;color:#8b949e}.text{white-space:pre-wrap;overflow-wrap:anywhere}
form{display:grid;grid-template-columns:1fr auto;gap:9px;padding:13px;border-top:1px solid #30363d}
input,button{font:inherit;border-radius:10px;border:1px solid #30363d}
input{background:#0d1117;color:#e6edf3;padding:12px}
button{background:#238636;color:white;font-weight:800;padding:0 18px;cursor:pointer}
.overlay{position:fixed;inset:0;background:#0d1117ee;display:grid;place-items:center;padding:20px}
.authbox{width:min(460px,95vw);background:#161b22;border:1px solid #30363d;border-radius:18px;padding:24px}
.authbox input{width:100%;margin:6px 0}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.hidden{display:none!important}.error{color:#ff7b72;font-size:12px;min-height:19px}.status{font-size:12px;color:#8b949e}
</style>
</head>
<body>
<div class="app">
<header>
<div><h1>WasteTime Chat 🗿</h1><div>Persistent accounts + public live chat.</div></div>
<div><div id="status" class="status">connecting…</div><div id="me">not logged in</div><button id="logout" class="hidden">Log out</button></div>
</header>
<main id="messages"></main>
<form id="chatForm"><input id="message" maxlength="500" placeholder="Log in to chat…" disabled><button id="send" disabled>Send</button></form>
</div>

<div id="overlay" class="overlay">
<div class="authbox">
<h2>WasteTime Account</h2>
<div class="tabs"><button id="loginTab">Log in</button><button id="registerTab">Register</button></div>
<div id="registerFields" class="hidden"><input id="username" maxlength="10" placeholder="Username (1–10 ASCII chars)"></div>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" minlength="6" placeholder="Password (6+ chars)">
<div id="authError" class="error"></div>
<button id="authGo">Log in</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getDatabase, ref, push, query, limitToLast, onChildAdded, get, set } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { firebaseConfig } from "./config.js";

const $ = id => document.getElementById(id);
const app = initializeApp(firebaseConfig);
const db = getDatabase(app, firebaseConfig.databaseURL);
const auth = getAuth(app);
let mode = "login", profile = null, messagesStarted = false;

function validName(s){
  if(s.length < 1 || s.length > 10) return false;
  return [...s].every(ch => { const n = ch.charCodeAt(0); return n >= 33 && n <= 126; });
}
function randomColor(){ return `hsl(${Math.floor(Math.random()*360)} 82% 68%)`; }

function setMode(m){
  mode = m;
  const reg = m === "register";
  $("registerFields").classList.toggle("hidden", !reg);
  $("authGo").textContent = reg ? "Create account" : "Log in";
  $("authError").textContent = "";
}
$("loginTab").onclick = () => setMode("login");
$("registerTab").onclick = () => setMode("register");

function showMessage(m){
  const row = document.createElement("div"); row.className = "msg";
  const dot = document.createElement("div"); dot.className = "dot"; dot.style.background = m.color || "#aaa";
  const bubble = document.createElement("div"); bubble.className = "bubble";
  const name = document.createElement("div"); name.className = "name"; name.style.color = m.color || "#ddd"; name.textContent = m.name || "?";
  const time = document.createElement("div"); time.className = "time"; time.textContent = m.createdAt ? new Date(m.createdAt).toLocaleTimeString() : "";
  const text = document.createElement("div"); text.className = "text"; text.textContent = m.text || "";
  bubble.append(name,time,text); row.append(dot,bubble); $("messages").append(row);
  $("messages").scrollTop = $("messages").scrollHeight;
}
function startMessages(){
  if(messagesStarted) return;
  messagesStarted = true;
  onChildAdded(query(ref(db,"messages"),limitToLast(100)), s => showMessage(s.val()));
}
async function loadProfile(uid){
  const s = await get(ref(db, `profiles/${uid}`));
  return s.exists() ? s.val() : null;
}

$("authGo").onclick = async () => {
  $("authError").textContent = "";
  try{
    const email = $("email").value.trim();
    const password = $("password").value;
    if(mode === "register"){
      const username = $("username").value;
      if(!validName(username)){ $("authError").textContent = "Username must be 1–10 printable ASCII characters, no spaces."; return; }
      const cred = await createUserWithEmailAndPassword(auth,email,password);
      await set(ref(db,`profiles/${cred.user.uid}`),{name:username,color:randomColor(),createdAt:Date.now()});
    } else {
      await signInWithEmailAndPassword(auth,email,password);
    }
  } catch(err){
    console.error(err);
    $("authError").textContent = (err.code || err.message || "Login failed").replace("auth/","");
  }
};

onAuthStateChanged(auth, async user => {
  if(!user){
    profile = null;
    $("overlay").classList.remove("hidden");
    $("logout").classList.add("hidden");
    $("message").disabled = true; $("send").disabled = true;
    $("status").textContent = "not logged in";
    return;
  }
  profile = await loadProfile(user.uid);
  if(!profile){ $("authError").textContent = "No profile found for this account."; await signOut(auth); return; }
  $("me").textContent = profile.name; $("me").style.color = profile.color;
  $("overlay").classList.add("hidden"); $("logout").classList.remove("hidden");
  $("message").disabled = false; $("send").disabled = false;
  $("status").textContent = "online";
  startMessages();
});

$("logout").onclick = () => signOut(auth);

$("chatForm").onsubmit = async e => {
  e.preventDefault();
  const user = auth.currentUser;
  const text = $("message").value.trim();
  if(!user || !profile || !text) return;
  $("message").value = "";
  await push(ref(db,"messages"),{uid:user.uid,name:profile.name,color:profile.color,text:text.slice(0,500),createdAt:Date.now()});
};
</script>
</body>
</html>
