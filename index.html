<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WasteTime Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,sans-serif;height:100vh;display:grid;place-items:center}
.app{width:min(900px,96vw);height:min(760px,94vh);background:#161b22;border:1px solid #30363d;border-radius:18px;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;box-shadow:0 20px 70px #0008}
header{padding:16px 18px;border-bottom:1px solid #30363d;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:19px;margin:0}.sub{font-size:12px;color:#8b949e}.me{font:13px ui-monospace,monospace;background:#0d1117;padding:8px 10px;border-radius:10px}
#messages{overflow:auto;padding:18px;display:flex;flex-direction:column;gap:11px}
.msg{display:grid;grid-template-columns:12px 1fr;gap:9px;align-items:start}.dot{width:10px;height:10px;border-radius:50%;margin-top:7px}
.bubble{background:#21262d;border:1px solid #30363d;border-radius:12px;padding:9px 11px;min-width:0}.meta{display:flex;gap:8px;align-items:baseline;margin-bottom:3px}.name{font-weight:800}.time{font-size:11px;color:#8b949e}.text{white-space:pre-wrap;overflow-wrap:anywhere}
form{display:grid;grid-template-columns:1fr auto;gap:9px;padding:13px;border-top:1px solid #30363d}input,button{font:inherit;border-radius:10px;border:1px solid #30363d}input{background:#0d1117;color:#e6edf3;padding:12px}button{background:#238636;color:white;font-weight:800;padding:0 18px;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
.overlay{position:fixed;inset:0;background:#0d1117ee;display:grid;place-items:center;padding:20px}.join{width:min(440px,95vw);background:#161b22;border:1px solid #30363d;border-radius:18px;padding:24px}.join h2{margin-top:0}.join input{width:100%;margin:8px 0}.hint,.error{font-size:12px}.hint{color:#8b949e}.error{color:#ff7b72;min-height:18px}.join button{height:43px;width:100%;margin-top:8px}
.hidden{display:none}.status{font-size:12px;color:#8b949e}
</style>
</head>
<body>
<div class="app">
<header><div><h1>WasteTime Chat 🗿</h1><div class="sub">A tiny public live chat.</div></div><div><div id="status" class="status">connecting…</div><div id="me" class="me">not joined</div></div></header>
<main id="messages"></main>
<form id="chatForm"><input id="message" maxlength="500" autocomplete="off" placeholder="Say something…" disabled><button id="send" disabled>Send</button></form>
</div>

<div id="overlay" class="overlay">
<div class="join"><h2>Pick a name</h2><p class="hint">1–10 printable ASCII characters, no spaces.</p>
<input id="username" maxlength="10" autocomplete="off" placeholder="your_name">
<div id="joinError" class="error"></div><button id="join">Enter chat</button></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getDatabase, ref, push, query, limitToLast, onChildAdded } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
import { firebaseConfig, databaseURL } from "./config.js";

const $=id=>document.getElementById(id);
const color=()=>`hsl(${Math.floor(Math.random()*360)} 82% 68%)`;
let username="", userColor=color(), db;

function validName(s){
  if(s.length<1||s.length>10)return false;
  return [...s].every(ch=>{const n=ch.charCodeAt(0);return n>=33&&n<=126});
}
function showMessage(m){
  if(!m||typeof m.name!=="string"||typeof m.text!=="string")return;
  const row=document.createElement("div"); row.className="msg";
  const dot=document.createElement("div"); dot.className="dot"; dot.style.background=m.color||"#aaa";
  const bubble=document.createElement("div"); bubble.className="bubble";
  const meta=document.createElement("div"); meta.className="meta";
  const name=document.createElement("span"); name.className="name"; name.textContent=m.name; name.style.color=m.color||"#ddd";
  const time=document.createElement("span"); time.className="time";
  time.textContent=m.createdAt?new Date(m.createdAt).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}):"now";
  const text=document.createElement("div"); text.className="text"; text.textContent=m.text;
  meta.append(name,time); bubble.append(meta,text); row.append(dot,bubble); $("messages").append(row);
  $("messages").scrollTop=$("messages").scrollHeight;
}

try{
  const app=initializeApp({...firebaseConfig,databaseURL});
  db=getDatabase(app, databaseURL);
  const recent=query(ref(db,"messages"),limitToLast(100));
  onChildAdded(recent,s=>showMessage(s.val()));
  $("status").textContent="online";
}catch(e){
  console.error(e);
  $("status").textContent="connection error";
  $("joinError").textContent="Could not connect to Firebase. Check the browser console.";
}

$("join").onclick=()=>{
  const s=$("username").value;
  if(!validName(s)){ $("joinError").textContent="Name must be 1–10 printable ASCII characters with no spaces."; return; }
  if(!db){$("joinError").textContent="Firebase connection is not ready.";return}
  username=s; $("me").textContent=username; $("me").style.color=userColor;
  $("overlay").classList.add("hidden"); $("message").disabled=false; $("send").disabled=false; $("message").focus();
};
$("username").addEventListener("keydown",e=>{if(e.key==="Enter")$("join").click()});
$("chatForm").onsubmit=async e=>{
  e.preventDefault();
  const text=$("message").value.trim();
  if(!text||!db)return;
  $("message").value="";
  try{
    await push(ref(db,"messages"),{
      name:username,
      color:userColor,
      text:text.slice(0,500),
      createdAt:Date.now()
    });
    $("status").textContent="online";
  }catch(err){
    console.error(err);
    $("status").textContent="send failed";
  }
};
</script>
</body></html>
